name: Keep Project Register API awake

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Project Register health endpoint
        run: |
          curl --fail --silent --show-error --max-time 60             https://api.project-register.helsinginhitsaus.fi/api/health
